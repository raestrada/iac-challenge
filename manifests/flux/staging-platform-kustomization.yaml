apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: staging-platform
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./deployments/staging/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: terraform-gcp
  # Disable health checks since we're not creating Deployments
  healthChecks: []
  # Make sure platform is applied before applications
  dependsOn:
    - name: flux-system
