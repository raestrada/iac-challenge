apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: production-apps
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./deployments/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: terraform-gcp
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: "*"
      namespace: default
