apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: spring-petclinic
  namespace: default
spec:
  components:
    - name: petclinic
      type: spring-app-with-db
      properties:
        name: petclinic
        namespace: default
        image: "springio/petclinic:latest"  # Sample Spring Boot pet clinic application
        version: "1.0.0"
        
        # GCP Project info is loaded from environment variables
        projectId: "${GCP_PROJECT_ID}"
        region: "${GCP_REGION}"
        
        # PostgreSQL database configuration
        dbConfig:
          name: "petclinic-db" 
          size: "small"
          
        # Resource requirements
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
