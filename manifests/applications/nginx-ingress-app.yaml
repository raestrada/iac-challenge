apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: nginx-ingress
  namespace: vela-system
spec:
  components:
    - name: nginx-ingress-controller
      type: helm
      properties:
        repoType: "helm"
        url: "https://kubernetes.github.io/ingress-nginx"
        chart: "ingress-nginx"
        version: "4.7.1"
        values:
          controller:
            # Use Google Cloud Network Load Balancer
            service:
              type: LoadBalancer
              annotations:
                cloud.google.com/load-balancer-type: "External"
                # Optimize for GCP - use NEG for better performance
                cloud.google.com/neg: '{"ingress": true}'
              externalTrafficPolicy: Local
            
            # Configure resource requests and limits
            resources:
              requests:
                cpu: 100m
                memory: 90Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            
            # Add GKE-specific configuration
            config:
              enable-real-ip: "true"
              use-proxy-protocol: "false"
              compute-full-forwarded-for: "true"
              use-forwarded-headers: "true"
            
            # Healthcheck settings
            livenessProbe:
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
            readinessProbe:
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 1
            
            # Enable metrics for monitoring
            metrics:
              enabled: true
              serviceMonitor:
                enabled: false # Set to true if you have Prometheus Operator installed
            
            # Pod affinity and anti-affinity for high availability
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                        - ingress-nginx
                    topologyKey: kubernetes.io/hostname
            
            # Autoscaling configuration
            autoscaling:
              enabled: true
              minReplicas: 2
              maxReplicas: 5
              targetCPUUtilizationPercentage: 80
              targetMemoryUtilizationPercentage: 80
  
  workflow:
    steps:
      - name: deploy-nginx-ingress
        type: apply-component
        properties:
          component: nginx-ingress-controller
