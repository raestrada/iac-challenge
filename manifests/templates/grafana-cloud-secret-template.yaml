apiVersion: v1
kind: Secret
metadata:
  name: grafana-alloy
  namespace: monitoring
type: Opaque
stringData:
  # These values should be replaced by your actual Grafana Cloud credentials
  GRAFANA_CLOUD_ZONE: "${GRAFANA_CLOUD_ZONE}"
  METRICS_USERNAME: "${GRAFANA_METRICS_USERNAME}"
  METRICS_API_KEY: "${GRAFANA_METRICS_API_KEY}"
  LOGS_USERNAME: "${GRAFANA_LOGS_USERNAME}"
  LOGS_API_KEY: "${GRAFANA_LOGS_API_KEY}"
  TRACES_USERNAME: "${GRAFANA_TRACES_USERNAME}"
  TRACES_API_KEY: "${GRAFANA_TRACES_API_KEY}"
