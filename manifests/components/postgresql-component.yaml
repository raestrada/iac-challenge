apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: terraform-postgresql
  namespace: vela-system
  annotations:
    definition.oam.dev/description: "Terraform component for provisioning a PostgreSQL instance on GCP"
spec:
  workload:
    definition:
      apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
  schematic:
    cue:
      template: |
        output: {
          apiVersion: "infra.contrib.fluxcd.io/v1alpha2"
          kind:       "Terraform"
          metadata: {
            name: context.name
          }
          spec: {
            interval: "10m"
            path:     "./tf-controller/gcp/postgresql"
            values: {
              name:       parameter.name
              size:       parameter.size
              project_id: parameter.project_id
              region:     parameter.region
            }
            sourceRef: {
              kind:      "GitRepository"
              name:      "terraform-gcp"
              namespace: "flux-system"
            }
            writeOutputsToSecret: {
              name: context.name + "-conn"
            }
            runnerPodTemplate: {
              spec: {
                containers: [{
                  name: "runner"
                  env: [{
                    name:  "GOOGLE_APPLICATION_CREDENTIALS"
                    value: "/credentials/credentials.json"
                  }]
                  volumeMounts: [{
                    name:      "gcp-credentials"
                    mountPath: "/credentials"
                    readOnly:  true
                  }]
                }]
                volumes: [{
                  name: "gcp-credentials"
                  secret: {
                    secretName: "gcp-credentials"
                    items: [{
                      key:  "credentials.json"
                      path: "credentials.json"
                    }]
                  }
                }]
              }
            }
          }
        }

        parameter: {
          // PostgreSQL configuration
          name: string
          size: *"small" | "medium" | "large"
          project_id: string
          region: *"us-central1" | string
        }

  status:
    customStatus: |
      message: ""
      status: ""
      if context.outputs.status == "succeeded" {
        message: "PostgreSQL database is ready"
        status: "Ready"
      }
      if context.outputs.status == "progressing" {
        message: "PostgreSQL database is being provisioned"
        status: "Creating"
      }
      if context.outputs.status == "failed" {
        message: "PostgreSQL database provisioning failed"
        status: "Error"
      }
    healthPolicy: |
      isHealth: context.output.status == "Ready"
