version: '3'

tasks:
  load-env:
    desc: Load environment variables for GCP resources
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Error: .env file not found. Please create it based on .env.example"
          exit 1
        fi
        
        source .env
        
        # Validate GCP environment variables
        if [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_REGION" ] || [ -z "$GCP_CREDENTIALS_PATH" ]; then
          echo "Error: GCP_PROJECT_ID, GCP_REGION, and GCP_CREDENTIALS_PATH must be set in .env file"
          exit 1
        fi
        
        if [ ! -f "$GCP_CREDENTIALS_PATH" ]; then
          echo "Error: GCP credentials file not found at $GCP_CREDENTIALS_PATH"
          exit 1
        fi
        
        echo "Environment variables loaded successfully"
    silent: false

  create-secret:
    desc: Create Kubernetes secret with GCP credentials
    deps: [load-env]
    cmds:
      - |
        echo "Creating secret for GCP credentials..."
        source .env
        
        # Create flux-system namespace if it doesn't exist
        kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
        
        # Create secret with GCP service account credentials
        kubectl create secret generic gcp-credentials \
          --namespace=flux-system \
          --from-file=credentials.json=$GCP_CREDENTIALS_PATH \
          --from-literal=project_id=$GCP_PROJECT_ID \
          --dry-run=client -o yaml | kubectl apply -f -
        
        echo "Creating secret for Git repository..."
        # Create secret for Git repository access
        kubectl create secret generic terraform-gcp \
          --namespace=flux-system \
          --from-literal=username=$GITHUB_ORG \
          --from-literal=password=$GITHUB_TOKEN \
          --dry-run=client -o yaml | kubectl apply -f -
          
        echo "GCP credentials and Git repository secrets created successfully"
    silent: false

  apply-git-repository:
    desc: Apply GitRepository resource with values from .env
    deps: [create-secret]
    cmds:
      - |
        echo "Applying GitRepository resource..."
        
        # Load environment variables properly
        if [ ! -f .env ]; then
          echo "Error: .env file not found. Please create it based on .env.example"
          exit 1
        fi
        
        # Export all environment variables to make them available to envsubst
        set -a
        source .env
        set +a
        
        # Debug - print the values to verify they're loaded correctly
        echo "Using GitHub org: $GITHUB_ORG"
        echo "Using GitHub repo: $GITHUB_REPO"
        
        # Use envsubst to replace variables in the GitRepository manifest
        mkdir -p .tmp
        
        # Create a properly formatted GitRepository YAML with explicit variables
        cat > .tmp/git-repository.yaml << EOF
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: GitRepository
        metadata:
          name: terraform-gcp
          namespace: flux-system
        spec:
          interval: 30s
          url: https://github.com/$GITHUB_ORG/$GITHUB_REPO.git
          secretRef:
            name: terraform-gcp
          ref:
            branch: main
        EOF
        
        # Apply the GitRepository resource
        kubectl apply -f .tmp/git-repository.yaml
        
        # Clean up temporary file only if successful
        if [ $? -eq 0 ]; then
          rm -rf .tmp
          echo "GitRepository resource applied successfully"
        else
          echo "Error applying GitRepository resource. Debug file saved at .tmp/git-repository.yaml"
          exit 1
        fi
    silent: false
