version: '3'

vars:
  MICROK8S_VERSION: 1.28/stable
  KUBECTL_VERSION: 1.28.0
  FLUX_VERSION: 2.2.3
  VELA_VERSION: v1.9.6

includes:
  microk8s:
    taskfile: ./scripts/setup/Taskfile.microk8s.yml
    vars:
      MICROK8S_VERSION: '{{.MICROK8S_VERSION}}'
  flux:
    taskfile: ./scripts/setup/Taskfile.flux.yml
    vars:
      FLUX_VERSION: '{{.FLUX_VERSION}}'
  kubevela:
    taskfile: ./scripts/setup/Taskfile.kubevela.yml
    vars:
      VELA_VERSION: '{{.VELA_VERSION}}'
  tofu:
    taskfile: ./scripts/setup/Taskfile.tofu-controller.yml
  gcp:
    taskfile: ./scripts/setup/Taskfile.gcp-credentials.yml
  components:
    taskfile: ./scripts/setup/Taskfile.components.yml
    dir: .
  flux-deployments:
    taskfile: ./scripts/setup/Taskfile.flux-deployments.yml
    dir: .
  nginx-ingress:
    taskfile: ./scripts/setup/Taskfile.nginx-ingress.yml
    dir: .

tasks:
  install-task:
    desc: Install go-task if not already installed
    cmds:
      - |
        if ! command -v task &> /dev/null; then
          echo "Installing go-task..."
          sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          echo "go-task installed successfully!"
        else
          echo "go-task is already installed, version: $(task --version)"
        fi
    silent: true

  install-kubectl:
    desc: Install kubectl CLI
    cmds:
      - |
        if ! command -v kubectl &> /dev/null || [[ "$(kubectl version --client -o json | jq -r '.clientVersion.gitVersion')" != *"{{.KUBECTL_VERSION}}"* ]]; then
          echo "Installing kubectl version {{.KUBECTL_VERSION}}..."
          curl -LO "https://dl.k8s.io/release/v{{.KUBECTL_VERSION}}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          echo "kubectl installed successfully!"
        else
          echo "kubectl version {{.KUBECTL_VERSION}} is already installed."
        fi
    silent: false

  install-tools:
    desc: Install all required CLI tools
    deps: [install-task]
    cmds:
      - task: install-kubectl
      - task: flux:install-cli
      - task: kubevela:install-cli
    silent: false

  setup-env:
    desc: Check for environment file and create if not exists
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Creating default .env file..."
          cat > .env << 'EOT'
        # Cluster Configuration
        KUBE_CONTEXT=microk8s

        # Flux Configuration
        GITHUB_USER=change-me
        GITHUB_TOKEN=change-me
        GITHUB_REPO=iac-challenge

        # GCP Configuration
        GCP_PROJECT_ID=change-me
        GCP_REGION=us-central1
        GCP_ZONE=us-central1-a
        GCP_CREDENTIALS_FILE=~/gcp-credentials.json
        EOT
          echo ".env file created. Please modify the values before proceeding."
          exit 1
        else
          echo "Using existing .env file"
        fi
    silent: false

  bootstrap:
    desc: Bootstrap the entire environment
    deps: [install-task]
    cmds:
      - task: setup-env
      - task: microk8s:install
      - task: microk8s:setup
      - task: install-tools
      # Install core components directly (not via bootstrap-gitops to avoid redundancy)
      - task: flux:install
      - task: kubevela:install
      - task: kubevela:enable-velaux
      - task: tofu:install
      - task: tofu:verify
      # Set up GCP credentials and Git repository
      - task: gcp:create-secret
      - task: gcp:apply-git-repository
      # Install component definitions
      - |
        echo "Installing KubeVela component definitions..."
        sleep 2
        kubectl apply -f manifests/components/gke-component.yaml
        kubectl apply -f manifests/components/postgresql-component.yaml
        kubectl apply -f manifests/components/spring-boot-component.yaml
        kubectl apply -f manifests/components/spring-app-with-db-component.yaml
        kubectl apply -f manifests/traits/service-binding-trait.yaml || true
        echo "Waiting for component definitions to be ready..."
        sleep 5
        # Set up Flux kustomizations
        echo "Setting up Flux kustomizations..."
        kubectl apply -f manifests/flux/staging-kustomization.yaml
        kubectl apply -f manifests/flux/production-kustomization.yaml
        echo "Verifying component installations..."
        kubectl get componentdefinition -A
        echo "Bootstrap complete! Your GitOps control plane is ready."
    silent: false

  install-k8s-components:
    desc: Install Kubernetes components (Flux, KubeVela, Tofu-Controller)
    cmds:
      - task: flux:install
      - task: kubevela:install
      - task: kubevela:enable-velaux
      - task: tofu:install
      - task: tofu:verify
    silent: false

  status:
    desc: Check status of all components
    cmds:
      - task: microk8s:status
      - task: flux:status
      - task: kubevela:status
      - task: tofu:status
      - |
        echo "To check GCP resources status, run: task gcp-status"
    silent: false

  access-ui:
    desc: Access KubeVela UI
    cmds:
      - task: kubevela:access-ui
    silent: false

  bootstrap-gitops:
    desc: Bootstrap Flux with GitOps repository
    cmds:
      - task: gcp:create-secret
      - task: gcp:apply-git-repository
      - echo "GitOps repository configured successfully. Flux will now synchronize with the Git repository."
    silent: false
    
  setup-gcp-gitops:
    desc: Set up GitOps connection to GCP terraform repository
    cmds:
      - task: gcp:apply-gcp-credentials
      - task: gcp:apply-github-secret
      - task: gcp:apply-git-repository
    silent: false

  setup-flux-deployments:
    desc: Setup Flux Kustomizations for GitOps deployments
    cmds:
      - task: flux-deployments:apply-all

  setup-nginx-ingress:
    desc: Deploy and configure Nginx Ingress Controller on GKE
    cmds:
      - task: nginx-ingress:install
      - task: nginx-ingress:get-ingress-ip
    silent: false

  bootstrap-flux-gitops:
    desc: Bootstrap Flux with GitOps repository (using flux bootstrap command)
    cmds:
      - task: flux:bootstrap
    silent: false

  all:
    desc: Install and configure everything
    cmds:
      - task: bootstrap
    silent: false
